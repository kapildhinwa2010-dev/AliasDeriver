[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "AliasDeriver"
version = "1.0.0"
description = "Alias derivation for knowledge compression"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Kapil Dhinwa"}]

[project.urls]
Homepage = "https://github.com/kapildhinwa2010-dev/AliasDeriver"

[tool.setuptools]
packages = ["aliasderiver"]
